# Test-stack dovecot. It follows mailstack's production configuration (storage, compression,
# encryption, special-use folders, full-text search) without the spam-training Sieve scripts,
# and reads its accounts from a static file. Validate any change with:
#   docker run --rm -v "$PWD/deploy/ci/dovecot:/etc/dovecot:ro" --entrypoint doveconf \
#     dovecot/dovecot:<pinned tag> -n

dovecot_config_version = 2.4.3
dovecot_storage_version = 2.3.0

base_dir = /run/dovecot
state_dir = /run/dovecot
protocols = imap lmtp
log_path = /dev/stdout

# --- Mail storage ---------------------------------------------------------------------------
# One system user owns every mailbox; virtual users are rows in the passwd-file. The rows leave
# uid, gid and home empty, so these settings are the only place they are defined.
mail_uid = 5000
mail_gid = 5000
first_valid_uid = 5000
last_valid_uid = 5000

mail_driver = maildir
mail_home = /var/vmail/%{user | domain}/%{user | username}
mail_path = ~/Maildir
mail_index_path = /var/vmail_index/%{user}
mail_volatile_path = /var/volatile/%{user}
# Record the threading headers when a message is saved. Without this dovecot reads every
# message in a folder the first time a client asks for its threads.
mail_always_cache_fields = hdr.message-id hdr.references hdr.in-reply-to hdr.subject date.sent date.received
# Folder names are mapped onto filenames; keep "." out of the on-disk names.
mailbox_list_storage_escape_char = "\\"

namespace inbox {
  inbox = yes
  separator = /

  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
    fts_autoindex = no
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
    fts_autoindex = no
  }
}

# --- At-rest protection: compression, then encryption with one site-wide key pair -----------
mail_plugins {
  mail_compress = yes
  mail_crypt = yes
  fts = yes
  fts_flatcurve = yes
}
mail_compress_write_method = lz4
# Generated by init.sh. The private key must be PKCS#8 ("BEGIN PRIVATE KEY").
crypt_global_public_key_file = /keys/mail_crypt/ecpubkey.pem
crypt_global_private_key main {
  crypt_private_key_file = /keys/mail_crypt/ecprivkey.pem
}

# --- Full text search -----------------------------------------------------------------------
fts_autoindex = yes
fts_autoindex_max_recent_msgs = 999
fts_search_add_missing = yes
language_filters = normalizer-icu snowball stopwords
language_tokenizers = generic email-address
language_tokenizer_generic_algorithm = simple
language en {
  default = yes
  filters = lowercase snowball english-possessive stopwords
}
fts flatcurve {
  substring_search = yes
  commit_limit = 100
}

# --- Authentication -------------------------------------------------------------------------
# No cache, so a test that rewrites the accounts file sees the change at the next login.
auth_cache_size = 0
auth_mechanisms = plain login
auth_username_format = %{user | lower}

passdb passwd-file {
  passwd_file_path = /auth/users
}
userdb passwd-file {
  passwd_file_path = /auth/users
}

# --- TLS ------------------------------------------------------------------------------------
ssl = required
ssl_server {
  cert_file = /keys/tls/tls.crt
  key_file = /keys/tls/tls.key
}
ssl_min_protocol = TLSv1.2

# --- Listeners ------------------------------------------------------------------------------
service imap-login {
  inet_listener imap {
    # No cleartext IMAP at all.
    port = 0
  }
  inet_listener imaps {
    port = 993
  }
}

# 12345 (SASL for postfix) and 24 (LMTP) are plaintext and unauthenticated. They are reachable
# only on the compose network; never publish them.
service auth {
  inet_listener sasl {
    port = 12345
  }
}
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}
