# Special-use folders, made for every account. Kept apart so dovecot-plain (criterion 20) can run
# the same configuration without them.
mailbox Archive {
  auto = subscribe
  special_use = \Archive
}
mailbox Drafts {
  auto = subscribe
  special_use = \Drafts
}
mailbox Junk {
  auto = subscribe
  special_use = \Junk
  fts_autoindex = no
}
mailbox Sent {
  auto = subscribe
  special_use = \Sent
}
mailbox Trash {
  auto = subscribe
  special_use = \Trash
  fts_autoindex = no
}
