# The test stack: a real dovecot and postfix, Postbox in front of them, and a browser. Used by
# deploy/ci/test.sh and, with compose.dev.yaml on top, by `just dev`. Every image is pinned by
# tag and digest.
#
# Nothing is published to the host here; the tests run from a container on the compose
# network. SEED_PASSWORD is the password of both seeded accounts and comes from the caller.
name: postbox-ci

services:
  # Generates the throwaway keys, fixes volume ownership and writes the accounts file.
  init:
    image: postbox-ci-postfix
    pull_policy: never # built by the postfix service below
    entrypoint: ["sh", "/init.sh"]
    environment:
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    volumes:
      - ./init.sh:/init.sh:ro
      - keys:/keys
      - ca:/ca
      - auth:/auth
      - vmail:/var/vmail
      - vmail_index:/var/vmail_index
    restart: "no"

  dovecot:
    image: dovecot/dovecot:2.4.5-root@sha256:e4e02686612ef57bce02ada4771e4a46dab7592e3e0498cccfcf2227138e26a9
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ./dovecot:/etc/dovecot:ro
      - keys:/keys:ro
      - auth:/auth:ro
      - vmail:/var/vmail
      - vmail_index:/var/vmail_index
    tmpfs:
      - /var/volatile:uid=5000,gid=5000,mode=0700

  postfix:
    image: postbox-ci-postfix
    build: ./postfix
    depends_on:
      init:
        condition: service_completed_successfully
      dovecot:
        condition: service_started
    volumes:
      - ./postfix/main.cf:/etc/postfix/main.cf:ro
      - ./postfix/master.cf:/etc/postfix/master.cf:ro
      - ./postfix/maps:/etc/postfix/maps:ro
      - keys:/keys:ro
      - postfix_queue:/var/spool/postfix

  postbox:
    image: postbox:ci
    build:
      context: ../..
      args:
        GO_TAGS: citest # adds the test clock; never in a release image
    depends_on:
      - dovecot
      - postfix
    environment:
      POSTBOX_IMAP_ADDR: dovecot:993
      POSTBOX_SMTP_ADDR: postfix:465
      POSTBOX_PUBLIC_URL: http://postbox.localhost
      POSTBOX_LISTEN: :80
      POSTBOX_CA_FILE: /ca/ca.crt
      # The browser tests choose the address each test signs in from, so throttling tests do
      # not block each other. Behind a real proxy this is the proxy's header.
      POSTBOX_CLIENT_IP_HEADER: X-Test-Client-IP
    volumes:
      # Only the certificate: Postbox never sees the mail server's private keys.
      - ca:/ca:ro
      - state:/data/postbox
    networks:
      default:
        aliases:
          - postbox.localhost

  # Postbox with nothing but the three required settings, for the start-up check in test.sh.
  postbox-minimal:
    image: postbox:ci
    pull_policy: never # built by the postbox service above
    profiles: [tools]
    environment:
      POSTBOX_IMAP_ADDR: dovecot:993
      POSTBOX_SMTP_ADDR: postfix:465
      POSTBOX_PUBLIC_URL: https://mail.example.test

  # The Go toolchain on the compose network, for tools that talk to the mail server directly:
  # `docker compose run --rm go go run ./cmd/mailbench check`.
  go:
    image: golang:1.27.3-trixie@sha256:af1bfc2614ebb1dbd31af514b78740fd678850e76498762b425ecee4c5c6ea80
    profiles: [tools]
    depends_on:
      - dovecot
    working_dir: /src
    environment:
      POSTBOX_IMAP_ADDR: dovecot:993
      POSTBOX_CA_FILE: /ca/ca.crt
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      # The checkout is mounted read-only and has no .git inside the container.
      GOFLAGS: -buildvcs=false
    volumes:
      - ../..:/src:ro
      - ca:/ca:ro
      - go_cache:/root/.cache/go-build
      - go_mod:/go/pkg/mod

  # Stands in for every remote server a message may point at. Test messages send their remote
  # images and hostile references here, and test.sh reads its log: a request it did not expect
  # means the sanitiser or the frame's policy let something through.
  sink:
    image: python:3.15.2-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
    command: ["python", "-I", "-m", "http.server", "80", "--directory", "/srv"]
    volumes:
      - ./sink:/srv:ro

  # Postbox without POSTBOX_CA_FILE: the mail server's certificate comes from an authority it
  # does not know, so every sign-in must fail with "Can't reach the mail server."
  postbox-untrusted:
    image: postbox:ci
    pull_policy: never # built by the postbox service above
    profiles: [tools]
    depends_on:
      - dovecot
    environment:
      POSTBOX_IMAP_ADDR: dovecot:993
      POSTBOX_SMTP_ADDR: postfix:465
      POSTBOX_PUBLIC_URL: http://postbox-untrusted.localhost
      POSTBOX_LISTEN: :80
      POSTBOX_CLIENT_IP_HEADER: X-Test-Client-IP
    networks:
      default:
        aliases:
          - postbox-untrusted.localhost

  # Playwright with Chromium. Run with `docker compose run --rm e2e`.
  e2e:
    image: postbox-ci-e2e
    build: ../../e2e
    profiles: [tools]
    depends_on:
      - postbox
    environment:
      POSTBOX_URL: http://postbox.localhost
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    volumes:
      # Signed-in browser state kept across a Postbox restart.
      - e2e_state:/e2e/.state
      # To check, as a second mail client would, what Postbox did to a mailbox.
      - ca:/ca:ro

volumes:
  keys:
  ca:
  auth:
  vmail:
  vmail_index:
  postfix_queue:
  state:
  e2e_state:
  go_cache:
  go_mod:
