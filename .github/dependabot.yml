# Weekly update PRs. Minor and patch updates come as one PR per ecosystem; a major
# version comes on its own. A release is proposed only once it is a week old, so a
# compromised version has time to be pulled before it reaches a PR.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go:
        update-types: [minor, patch]

  # The app's frontend and the browser tests.
  - package-ecosystem: npm
    directories: [/web, /e2e]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]

  # Base images pinned by tag and digest: the release image and the test stack's.
  - package-ecosystem: docker
    directories: [/, /e2e, /deploy/ci/postfix]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
